[package]
name = "deskTodo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = "0.4"
dirs = "7.0.0"
earcut = "0.4.11"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
eguidev = { path = "vendor/eguidev/crates/eguidev" }
eguidev_runtime = { path = "vendor/eguidev/crates/eguidev_runtime", optional = true }
global-hotkey = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }

[features]
devtools = ["dep:eguidev_runtime"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
