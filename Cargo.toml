[package]
name = "deskTodo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = "0.4"
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
global-hotkey = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.25.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
